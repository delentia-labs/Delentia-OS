name: Package check

# Round 78: a clean `pip install delentia-os` could not import the algorithm kernel because pyproject.toml did not declare what the kernel imports
# (requirements.txt did, so every other CI job passed). This job installs the BUILT WHEEL into an empty virtual environment, the way a user would.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "pyproject.toml"
      - "rct_control_plane/**"
      - "core/**"
      - "signedai/**"
      - "microservices/**"
      - "scripts/check_installed_wheel.py"
      - "scripts/package_desk.py"
      - "apps/gui/**"
      - ".github/workflows/package-check.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "scripts/check_installed_wheel.py"
      - ".github/workflows/package-check.yml"

permissions:
  contents: read

jobs:
  clean-install:
    name: Wheel installs and starts in an empty environment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the Desk and put it inside the package
        run: python scripts/package_desk.py
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --wheel
          twine check dist/*.whl
      - name: The wheel carries the Desk
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          desk = [n for n in names if n.startswith("rct_control_plane/desk_ui/")]
          assert "rct_control_plane/desk_ui/index.html" in desk and len(desk) > 20, f"the wheel has {len(desk)} Desk files"
          print("the wheel carries", len(desk), "Desk files")
          EOF
      - name: Install it into an empty virtual environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install dist/*.whl
      - name: Import the parts a user reaches first, and run the CLI
        env:
          DELENTIA_HOME: /tmp/clean-home
          HOME: /tmp/clean-user
        working-directory: /tmp
        run: |
          /tmp/clean/bin/python - <<'EOF'
          import importlib
          failed = []
          for name in ("rct_control_plane.cli", "rct_control_plane.api", "rct_control_plane.governed_autonomous_loop", "rct_control_plane.mcp_server",
                       "rct_control_plane.acp_server", "rct_control_plane.algorithm_kernel_41", "rct_control_plane.agent_factory"):
              try:
                  importlib.import_module(name)
                  print("ok  ", name)
              except Exception as exc:                       # noqa: BLE001
                  failed.append(name)
                  print("FAIL", name, type(exc).__name__, str(exc)[:200])
          raise SystemExit(1 if failed else 0)
          EOF
          /tmp/clean/bin/delentia --help
          /tmp/clean/bin/delentia demo init
          /tmp/clean/bin/delentia demo status
      - name: Install contract (imports, CLI, scripted demos, server, memory, read-only package folder)
        # Round 82 (T03): the claims the README makes to a newcomer, checked on the INSTALLED package with temporary data folders, no model and no network.
        working-directory: /tmp
        run: |
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/scripts/check_installed_wheel.py" --receipt /tmp/install-receipt.json
      - name: Keep the receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-receipt
          path: /tmp/install-receipt.json
          if-no-files-found: ignore

  extras:
    name: Optional extras install and the core does not need them
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: The core install does not pull the heavy extras
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/python -m pip install --quiet dist/*.whl
          for module in cv2 faiss; do
            if /tmp/core/bin/python -c "import $module" 2>/dev/null; then echo "$module is installed by the core wheel, but is meant to be an extra"; exit 1; fi
          done
          /tmp/core/bin/python -c "import rct_control_plane.algorithm_kernel_41; print('the kernel imports without the extras')"
      - name: Each extra installs and imports
        run: |
          for pair in video:cv2 vector:faiss graph:networkx llm:openai; do
            extra="${pair%%:*}"; module="${pair##*:}"
            python -m venv "/tmp/$extra"
            "/tmp/$extra/bin/python" -m pip install --quiet "$(ls dist/*.whl)[$extra]"
            "/tmp/$extra/bin/python" -c "import $module; print('$extra ->', '$module', 'imports')"
          done
