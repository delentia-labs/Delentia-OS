name: Trigger Ecosystem Release

# When a version tag is pushed to delentia-os, dispatch release events
# to dependent repos so they can build + release in sync.
#
# Dependent repos that respond to repository_dispatch:
#   - delentia-gui      (builds Tauri .msi/.dmg/.AppImage/.deb)
#   - delentia-infra-public (updates install scripts, docker-compose pin)
#
# Setup: each target repo needs a Personal Access Token (PAT) with
# `repo` scope stored as secret RELEASE_DISPATCH_TOKEN in delentia-os.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"         # v2.0.0, v2.1.3 ...
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+" # v2.1.0-rc.1

permissions:
  contents: read

jobs:
  extract-version:
    name: Extract version info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_prerelease: ${{ steps.v.outputs.is_prerelease }}
    steps:
      - id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if echo "$TAG" | grep -qE '\-(alpha|beta|rc)\.' ; then
            echo "is_prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION (tag: $TAG)"

  dispatch-gui-release:
    name: Dispatch → delentia-gui
    runs-on: ubuntu-latest
    needs: extract-version
    continue-on-error: true  # Non-blocking: token may lack cross-repo write permission
    steps:
      - name: Send repository_dispatch to delentia-gui
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          repository: delentia-labs/delentia-gui
          event-type: new-os-release
          client-payload: |
            {
              "version": "${{ needs.extract-version.outputs.version }}",
              "tag": "${{ github.ref_name }}",
              "is_prerelease": ${{ needs.extract-version.outputs.is_prerelease }},
              "commit_sha": "${{ github.sha }}",
              "release_url": "https://github.com/delentia-labs/delentia-os/releases/tag/${{ github.ref_name }}"
            }

  dispatch-infra-release:
    name: Dispatch → delentia-infra-public
    runs-on: ubuntu-latest
    needs: extract-version
    continue-on-error: true  # Non-blocking: token may lack cross-repo write permission
    steps:
      - name: Send repository_dispatch to delentia-infra-public
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          repository: delentia-labs/delentia-infra-public
          event-type: new-os-release
          client-payload: |
            {
              "version": "${{ needs.extract-version.outputs.version }}",
              "tag": "${{ github.ref_name }}",
              "is_prerelease": ${{ needs.extract-version.outputs.is_prerelease }},
              "commit_sha": "${{ github.sha }}"
            }

  dispatch-ecosystem-validate:
    name: Dispatch → delentia-ecosystem
    runs-on: ubuntu-latest
    needs: extract-version
    continue-on-error: true  # Non-blocking: token may lack cross-repo write permission
    steps:
      - name: Send repository_dispatch to delentia-ecosystem
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          repository: delentia-labs/delentia-ecosystem
          event-type: new-os-release
          client-payload: |
            {
              "version": "${{ needs.extract-version.outputs.version }}",
              "tag": "${{ github.ref_name }}"
            }

  create-github-release:
    name: Create GitHub Release for delentia-os
    runs-on: ubuntu-latest
    needs: extract-version
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          # Extract section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md 2>/dev/null || echo "See CHANGELOG.md for details.")
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Delentia OS v${{ needs.extract-version.outputs.version }}"
          body: ${{ steps.notes.outputs.notes }}
          prerelease: ${{ needs.extract-version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
