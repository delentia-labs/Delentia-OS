name: Security Scan

on:
  schedule:
    - cron: "0 3 * * *"  # Daily at 03:00 UTC
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Secret Detection (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          # Full history required so gitleaks can scan all commits
          fetch-depth: 0

      - name: Install gitleaks binary
        # gitleaks-action@v2 requires GITLEAKS_LICENSE for org accounts.
        # The binary has no such restriction and is free to use.
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run gitleaks secret scan
        # .gitleaks.toml provides allowlist for doc/example false-positives
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --no-banner \
            --redact

  cve-scan:
    name: CVE Scan (safety)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project + pip-audit
        # Round 28 Phase 26 Task 52: `pip-audit -r requirements.txt` (the
        # previous approach) audits requirements.txt's version SPECIFIERS,
        # not what actually gets installed/runs — verified this really
        # differs: isolating `aiohttp>=3.9.0` (exactly as declared) into
        # its own file and auditing it reports clean, while the real
        # installed aiohttp (3.14.1, resolved from that same specifier)
        # has 6 known CVEs. Installing for real first and auditing the
        # actual environment is the only way this scan means what it
        # appears to mean.
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pip-audit

      - name: CVE scan — real installed environment
        # continue-on-error: still non-blocking. NOT because packages are
        # "almost upgraded" (the previous comment's premise was wrong —
        # the old scan mode wouldn't have caught real issues even after
        # upgrades) but because a real environment-wide scan on
        # 2026-09-19 found 178 known vulnerabilities across 25 installed
        # packages, several of them heavy ML dependencies (torch, pillow,
        # nltk, starlette) that real algorithm modules (ALGO-14/27/34/36)
        # depend on for exact behavior — remediating those safely needs a
        # dedicated round with full-suite verification per upgrade, not a
        # blocking gate flipped on today. See
        # DELENTIA_ROUND28_*_SYNTHESIS.md for the full package list and
        # the Round 29 remediation plan.
        run: |
          mkdir -p artifacts/security
          pip-audit \
            --desc on \
            --format json \
            --output artifacts/security/pip-audit.json \
            --progress-spinner off \
            || (cat artifacts/security/pip-audit.json ; exit 1)
        continue-on-error: true

      - name: Upload CVE report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cve-report-${{ github.sha }}
          path: artifacts/security/pip-audit.json
          retention-days: 30

  bandit:
    name: SAST (bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        # Fail the build when HIGH severity issues are found (-lll).
        # Medium/low issues are still reported in the artifact but do not block.
        run: |
          mkdir -p artifacts/security
          bandit -r core/ signedai/ rct_control_plane/ microservices/ \
            --exclude .venv,venv,tests,build,dist \
            -lll \
            -f json \
            -o artifacts/security/bandit.json
          echo "Bandit scan complete — see artifact for findings."

      - name: Upload results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bandit-results
          path: artifacts/security/bandit.json
