name: Security Scan

on:
  schedule:
    - cron: "0 3 * * *"  # Daily at 03:00 UTC
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Secret Detection (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          # Full history required so gitleaks can scan all commits
          fetch-depth: 0

      - name: Install gitleaks binary
        # gitleaks-action@v2 requires GITLEAKS_LICENSE for org accounts.
        # The binary has no such restriction and is free to use.
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run gitleaks secret scan
        # .gitleaks.toml provides allowlist for doc/example false-positives
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --no-banner \
            --redact

  cve-scan:
    name: CVE Scan (safety)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project + pip-audit
        # Round 28 Phase 26 Task 52: `pip-audit -r requirements.txt` (the
        # previous approach) audits requirements.txt's version SPECIFIERS,
        # not what actually gets installed/runs — verified this really
        # differs: isolating `aiohttp>=3.9.0` (exactly as declared) into
        # its own file and auditing it reports clean, while the real
        # installed aiohttp (3.14.1, resolved from that same specifier)
        # has 6 known CVEs. Installing for real first and auditing the
        # actual environment is the only way this scan means what it
        # appears to mean.
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          # Round 29 Task 64: verified via `importlib.metadata.requires()`
          # that none of requirements.txt/requirements-dev.txt's own
          # packages transitively pull in torch/nltk/accelerate - this
          # job's real scope never installs them, so its pip-audit run
          # can never see them. setuptools (a bootstrap tool ALWAYS
          # present) is the one real exception; bumped explicitly here
          # since this scope has no torch installed to conflict with it
          # (unlike the full-extras dev environment - see pyproject.toml's
          # `diffusion` extra comment for that real, separate constraint).
          pip install "setuptools>=83.0.0"
          pip install pip-audit

      - name: CVE scan — real installed environment
        # Round 29 Task 64: flipped to BLOCKING. Round 28 found 178 real
        # vulnerabilities across 25 packages in the FULL-extras dev
        # environment; Round 29 fixed everything reachable (aiohttp,
        # anyio, cryptography, h2, lxml, lxml-html-clean, mkdocs-material,
        # msgpack, pillow, pip, pydantic-settings, pygments, pyjwt,
        # pymdown-extensions, pytest, python-multipart, requests,
        # soupsieve, starlette, urllib3 - 19 packages closed for real,
        # verified via full regression suite per group). The 4 that
        # remain in the full-extras environment (accelerate, nltk, torch,
        # setuptools) are honestly blocked: accelerate/nltk have NO
        # upstream fix published yet (fix_versions: [] in real pip-audit
        # output); torch's fix hit a real Windows path-length install
        # failure needing the Architect's own system-setting change
        # first; setuptools's fix conflicts with torch's own declared
        # ceiling. NONE of those 4 packages are installed in THIS job's
        # scope (requirements.txt + requirements-dev.txt only, matching
        # what ci.yml's own test run installs) — verified, not assumed —
        # so blocking here is honest: this scope should now be clean.
        # This does NOT mean the full-extras/production ML path is
        # vulnerability-free; that gap is real and tracked as a Round 30
        # candidate (extending this scan's scope to the optional extras).
        run: |
          mkdir -p artifacts/security
          pip-audit \
            --desc on \
            --format json \
            --output artifacts/security/pip-audit.json \
            --progress-spinner off \
            || (cat artifacts/security/pip-audit.json ; exit 1)

      - name: Upload CVE report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cve-report-${{ github.sha }}
          path: artifacts/security/pip-audit.json
          retention-days: 30

  cve-scan-ml-extras:
    name: CVE Scan — ML extras (non-blocking, real visibility)
    runs-on: ubuntu-latest
    # Round 30 Task (item 2 of the Round 29 candidate list): the main
    # cve-scan job above only ever installs requirements.txt +
    # requirements-dev.txt, which never pulls in torch/nltk/accelerate/
    # pillow (verified via importlib.metadata.requires() in Round 29
    # Task 64) - so that job's "blocking, clean" result says nothing
    # about the real ML extras path real algorithm modules (ALGO-14/27/
    # 34/36) actually use in production. This job gives that real
    # visibility. Non-blocking (continue-on-error) because 2 real,
    # currently-unfixable findings (accelerate, nltk - no upstream fix
    # published as of Round 29) will always show up here regardless of
    # what we do - see the Round 29/30 synthesis docs. Also genuinely
    # useful: this runs on ubuntu-latest, where the Windows path-length
    # install failure that blocked torch's own CVE fix locally may not
    # even occur - this job can tell us for real, without needing the
    # Architect's own machine.
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project with full ML extras + pip-audit
        run: |
          pip install -e ".[full]"
          pip install pip-audit

      - name: CVE scan — real ML-extras environment (report only)
        run: |
          mkdir -p artifacts/security
          pip-audit \
            --desc on \
            --format json \
            --output artifacts/security/pip-audit-ml-extras.json \
            --progress-spinner off \
            || (cat artifacts/security/pip-audit-ml-extras.json ; exit 1)
        continue-on-error: true

      - name: Upload ML-extras CVE report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cve-report-ml-extras-${{ github.sha }}
          path: artifacts/security/pip-audit-ml-extras.json
          retention-days: 30

  bandit:
    name: SAST (bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        # Fail the build when HIGH severity issues are found (-lll).
        # Medium/low issues are still reported in the artifact but do not block.
        run: |
          mkdir -p artifacts/security
          bandit -r core/ signedai/ rct_control_plane/ microservices/ \
            --exclude .venv,venv,tests,build,dist \
            -lll \
            -f json \
            -o artifacts/security/bandit.json
          echo "Bandit scan complete — see artifact for findings."

      - name: Upload results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bandit-results
          path: artifacts/security/bandit.json
