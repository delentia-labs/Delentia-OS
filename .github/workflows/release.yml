name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Job 1: Build + Create GitHub Release ──────────────────────────────────
  github-release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/update GitHub Release

    outputs:
      dist-path: ${{ steps.build.outputs.dist-path }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the Desk and put it inside the package (so `pip install` brings the web pages)
        run: python scripts/package_desk.py

      - name: The tag is the package version, and the number is free on PyPI
        # The upload below uses skip-existing: a tag whose number is already published would "succeed" and publish nothing.
        run: python scripts/check_versions.py --tag "${GITHUB_REF_NAME}" --registry

      - name: Build sdist + wheel
        id: build
        run: |
          python -m build
          echo "dist-path=dist/" >> "$GITHUB_OUTPUT"
          python scripts/check_versions.py --tag "${GITHUB_REF_NAME}" --wheel "$(ls dist/*.whl | head -n 1)"

      - name: Verify distribution integrity
        run: twine check dist/*

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          NOTES=$(awk "/^## \[${VER}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          allowUpdates: true          # update existing release instead of failing
          fail_on_unmatched_files: false
        # continue-on-error: GitHub Release update is best-effort —
        # PyPI publish job runs independently and is never blocked.
        continue-on-error: true

      - name: Upload dist artifacts for PyPI job
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 1

  # ── Job 2: Publish to PyPI (independent, never blocked by Job 1) ──────────
  pypi-publish:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read               # read artifacts only; no OIDC needed (token auth)

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish to TestPyPI (dry-run validation)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          attestations: false
        continue-on-error: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN || secrets.PYPI_API_TOKEN }}
          skip-existing: true
          attestations: false

  # ── Windows installer: built, installed and checked on a Windows runner, then attached to the release (never blocks PyPI) ──
  windows-installer:
    name: Windows installer
    needs: github-release
    permissions:
      contents: write
    uses: ./.github/workflows/windows-installer.yml
    with:
      tag: ${{ github.ref_name }}

  # ── Job 3: Publish TypeScript SDK to npm ──────────────────────────────────
  npm-publish:
    name: Publish to npm
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk-typescript

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: sdk-typescript/package-lock.json

      # The TypeScript SDK has its own version (sdk-typescript/package.json), which is NOT the Python package's version.
      # A release tag of the Python package must not try to publish the same npm version again: npm refuses it and the whole
      # workflow showed a red cross on every release (found on v2.4.1, where 1.4.0 was already on the registry).
      - name: Is this SDK version already on npm?
        id: npmver
        run: |
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          published=$(npm view "$name@$ver" version 2>/dev/null || true)
          if [ "$published" = "$ver" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$ver is already on npm: nothing to publish for this release (bump sdk-typescript/package.json to publish a new SDK version)."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$name@$ver is not on npm yet: publishing."
          fi

      - name: Install dependencies
        if: steps.npmver.outputs.publish == 'true'
        run: npm ci

      - name: Run tests
        if: steps.npmver.outputs.publish == 'true'
        run: npm test -- --passWithNoTests

      - name: Build (prepublishOnly)
        if: steps.npmver.outputs.publish == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.npmver.outputs.publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DELENTIA || secrets.NPM_TOKEN }}
