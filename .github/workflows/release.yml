name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Job 1: Build + Create GitHub Release ──────────────────────────────────
  github-release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/update GitHub Release

    outputs:
      dist-path: ${{ steps.build.outputs.dist-path }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        id: build
        run: |
          python -m build
          echo "dist-path=dist/" >> "$GITHUB_OUTPUT"

      - name: Verify distribution integrity
        run: twine check dist/*

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          NOTES=$(awk "/^## \[${VER}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          allowUpdates: true          # update existing release instead of failing
          fail_on_unmatched_files: false
        # continue-on-error: GitHub Release update is best-effort —
        # PyPI publish job runs independently and is never blocked.
        continue-on-error: true

      - name: Upload dist artifacts for PyPI job
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 1

  # ── Job 2: Publish to PyPI (independent, never blocked by Job 1) ──────────
  pypi-publish:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read               # read artifacts only; no OIDC needed (token auth)

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish to TestPyPI (dry-run validation)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          attestations: false
        continue-on-error: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN || secrets.PYPI_API_TOKEN }}
          skip-existing: true
          attestations: false

  # ── Job 3: Publish TypeScript SDK to npm ──────────────────────────────────
  npm-publish:
    name: Publish to npm
    needs: github-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-typescript

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: sdk-typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build (prepublishOnly)
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
