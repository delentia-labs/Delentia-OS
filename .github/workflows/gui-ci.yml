name: GUI CI

# apps/gui (desktop GUI, Next.js + Tauri), merged from delentia-labs/Delentia-OS-Gui
# in Round 49 P2. Its SDK dependencies now come from this repo's sdk-typescript/
# instead of a second checkout.
on:
  push:
    branches: [main]
    paths: ["apps/gui/**", "sdk-typescript/packages/fdia-wasm/**", "sdk-typescript/packages/rct-edge/**", ".github/workflows/gui-ci.yml"]
  pull_request:
    paths: ["apps/gui/**", "sdk-typescript/packages/fdia-wasm/**", "sdk-typescript/packages/rct-edge/**", ".github/workflows/gui-ci.yml"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the SDK packages the GUI depends on
        run: |
          for p in fdia-wasm rct-edge; do
            (cd sdk-typescript/packages/$p && npm ci --ignore-scripts && npm run build)
          done

      - name: Install dependencies
        working-directory: apps/gui
        run: npm ci

      - name: Type check
        working-directory: apps/gui
        run: npm run type-check

      - name: Lint
        working-directory: apps/gui
        run: npm run lint

      - name: Build (static export)
        working-directory: apps/gui
        run: npm run build
        env:
          NEXT_PUBLIC_GATEWAY: http://localhost:8000
          NEXT_PUBLIC_API_KEY: ci-placeholder-key

  rust:
    name: Rust (Tauri backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gui/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/gui/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/gui/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test
