version: "3.9"

# RCT Platform — Monitoring Stack
# Includes: Prometheus (scraping) + Grafana (dashboards) + optional OpenTelemetry Collector
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Grafana:    http://localhost:3000  (admin/admin)
# Prometheus: http://localhost:9090

services:

  # ─── PROMETHEUS ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: rct-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - rct-monitoring

  # ─── GRAFANA ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: rct-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docs/assets/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/rct-platform.json:ro
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - rct-monitoring

  # ─── OTEL COLLECTOR (optional — for SDK span export) ──────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: rct-otel-collector
    volumes:
      - ./config/otel-collector.yml:/etc/otel-collector-config.yaml:ro
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "8888:8888"    # Collector metrics (self)
    restart: unless-stopped
    networks:
      - rct-monitoring
    profiles:
      - otel

volumes:
  prometheus_data:
  grafana_data:

networks:
  rct-monitoring:
    name: rct-monitoring
