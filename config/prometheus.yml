# Prometheus scrape configuration for delentia-os
# Place at: config/prometheus.yml
# Reference: docker-compose.monitoring.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    monitor: "delentia-os"
    environment: "local"

scrape_configs:

  # ─── RCT PLATFORM API ───────────────────────────────────────────────────
  - job_name: "delentia-os"
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: "rct-control-plane"
    metrics_path: "/metrics"
    scrape_interval: 15s

  # ─── PROMETHEUS SELF-MONITORING ─────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ─── OTEL COLLECTOR (if running) ────────────────────────────────────────
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
    metrics_path: "/metrics"
