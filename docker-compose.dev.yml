services:
  # --- Gateway API ---
  # Main entry point: routes intents from clients to internal services
  gateway-api:
    build:
      context: .
      dockerfile: microservices/gateway-api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RCT_LOG_LEVEL=DEBUG
      - RCT_ENV=development
    volumes:
      - ./microservices/gateway-api:/app/microservices/gateway-api:ro
      - ./core:/app/core:ro
    depends_on:
      - intent-loop
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Intent Loop ---
  # Self-optimizing intent processing engine (cold start → warm recall)
  intent-loop:
    build:
      context: .
      dockerfile: microservices/intent-loop/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - RCT_LOG_LEVEL=DEBUG
      - RCT_ENV=development
    volumes:
      - ./microservices/intent-loop:/app/microservices/intent-loop:ro
      - ./core:/app/core:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Analysearch Intent ---
  # Intent analysis and semantic search over agent memory
  analysearch:
    build:
      context: .
      dockerfile: microservices/analysearch-intent/Dockerfile
    ports:
      # Real, confirmed need (2026-09-24): this service's own Dockerfile/
      # README consistently document port 8020 as its real, internal port
      # (CMD binds --port 8020) - the previous "8002:8002" mapping forwarded
      # a host port nothing inside the container was ever listening on,
      # so http://localhost:8002 would have been unreachable even with a
      # fully healthy container.
      - "8020:8020"
    environment:
      - RCT_LOG_LEVEL=DEBUG
      - RCT_ENV=development
    volumes:
      - ./microservices/analysearch-intent:/app/microservices/analysearch-intent:ro
      - ./core:/app/core:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Vector Search ---
  # Fast semantic similarity search over compressed delta states
  vector-search:
    build:
      context: .
      dockerfile: microservices/vector-search/Dockerfile
    ports:
      # Real, confirmed need (2026-09-24): same class of fix as analysearch
      # above - this service's own Dockerfile/README consistently document
      # port 8016 as its real, internal port.
      - "8016:8016"
    environment:
      - RCT_LOG_LEVEL=DEBUG
      - RCT_ENV=development
    volumes:
      - ./microservices/vector-search:/app/microservices/vector-search:ro
      - ./core:/app/core:ro
    healthcheck:
      # /vector/health, not /health: this service's real router is mounted
      # with prefix="/vector" (see app/api/routes.py) - confirmed matches
      # this Dockerfile's own healthcheck, which already used the correct
      # path.
      test: ["CMD", "curl", "-f", "http://localhost:8016/vector/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Crystallizer ---
  # Pattern crystallization: hardens repeated intent patterns into optimized paths
  crystallizer:
    build:
      context: .
      dockerfile: microservices/crystallizer/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - RCT_LOG_LEVEL=DEBUG
      - RCT_ENV=development
    volumes:
      - ./microservices/crystallizer:/app/microservices/crystallizer:ro
      - ./core:/app/core:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
