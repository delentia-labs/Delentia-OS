[package]
name = "delentia-gui"
version = "1.0.1"
description = "Delentia Desk — Desktop GUI for Delentia OS"
authors = ["Delentia Labs <infra@delentia.com>"]
license = "Apache-2.0"
repository = "https://github.com/delentia-labs/delentia-gui"
edition = "2021"
rust-version = "1.77"

[lib]
name = "delentia_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "delentia-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
thiserror = "1"

[features]
# This feature is used for production builds or when a dev server is not specified
custom-protocol = ["tauri/custom-protocol"]
