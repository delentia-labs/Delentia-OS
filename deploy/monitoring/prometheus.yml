global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: delentia-gateway
    static_configs:
      - targets: ["gateway-api:8000"]
    metrics_path: /metrics

  - job_name: delentia-intent-loop
    static_configs:
      - targets: ["intent-loop:8001"]
    metrics_path: /metrics

  - job_name: delentia-analysearch
    static_configs:
      - targets: ["analysearch-intent:8002"]
    metrics_path: /metrics

  - job_name: delentia-crystallizer
    static_configs:
      - targets: ["crystallizer:8004"]
    metrics_path: /metrics

  - job_name: qdrant
    static_configs:
      - targets: ["vector-search:6333"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
