name: Build & Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v2.*"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to use (e.g. 2.0.1)"
        required: true
        default: "2.0.0"

permissions:
  contents: read
  packages: write  # required to push to GHCR

env:
  REGISTRY: ghcr.io
  ORG: delentia-labs

jobs:
  build-matrix:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: gateway-api
            port: 8000
          - name: intent-loop
            port: 8001
          - name: analysearch-intent
            port: 8002
          - name: crystallizer
            port: 8004

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Strip leading "v" for semver tags: v2.1.3 → 2.1.3
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.tag.outputs.image }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: docker/dockerfiles/${{ matrix.service.name }}
          file: docker/dockerfiles/${{ matrix.service.name }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          provenance: true
          sbom: true

  verify-images:
    name: Verify all images are pullable
    runs-on: ubuntu-latest
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull and verify all images
        run: |
          for svc in gateway-api intent-loop analysearch-intent crystallizer; do
            IMG="${{ env.REGISTRY }}/${{ env.ORG }}/${svc}:${{ steps.tag.outputs.tag }}"
            echo "Pulling ${IMG}..."
            docker pull "$IMG"
            echo "✓ ${svc} image verified"
          done

      - name: Run health check on gateway-api
        run: |
          docker run --rm -d \
            --name test-gateway \
            -p 8000:8000 \
            -e DELENTIA_API_KEY="" \
            "${{ env.REGISTRY }}/${{ env.ORG }}/gateway-api:${{ steps.tag.outputs.tag }}"
          sleep 5
          curl -fsS http://localhost:8000/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', d"
          echo "✓ gateway-api health check passed"
          docker stop test-gateway
