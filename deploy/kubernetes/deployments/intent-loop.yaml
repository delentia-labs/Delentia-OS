apiVersion: apps/v1
kind: Deployment
metadata:
  name: intent-loop
  namespace: delentia
  labels:
    app: intent-loop
    tier: community
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intent-loop
  template:
    metadata:
      labels:
        app: intent-loop
    spec:
      containers:
        - name: intent-loop
          image: ghcr.io/delentia-labs/intent-loop:2.0
          ports:
            - containerPort: 8001
          env:
            - name: DELENTIA_ENV
              value: production
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: delentia-secrets
                  key: postgres-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10


