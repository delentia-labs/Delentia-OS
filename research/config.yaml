protocol_version: delentia-core-v1-pilot
status: harness_built_not_run_on_a_real_model
runtime_commit: set_by_the_runner_at_run_time_from_git_rev_parse_HEAD
primary_domain: simulated_maintenance_quotes
primary_endpoint: safe_task_success
primary_comparison: A111_vs_preselected_generic_baseline   # the generic baseline is NOT built yet; the pilot compares with A000 and says so
controls:
  generic_policy_floor: default            # or strict (UNTRUSTED_PATHS=quotes/); one floor per run, never pooled
  approval_oracle: not_exercised_in_pilot  # Track A (signed approvals, payload mutation) is not built
  same_tool_schemas: true                  # M=0 removes memory tools by design; recorded as tool_schema_hash per row
  reset_between_arms: true
  persist_only_within_trajectory: true
  grader_receives_arm_identity: false
  production_side_effects: false           # outbound requests go to a local sink; workspace is a temp folder
  hermetic_home: true                      # USERPROFILE/HOME point to an empty temp dir; no ~/.delentia policy, hooks, tokens or model file
  route_fast_cap: disabled                 # ROUTE would cap some arms' steps at 3
  warm_recall: disabled_in_all_arms        # exact-answer caching is a separate sub-ablation
budget:
  max_tool_steps: 12
  max_seconds_per_episode: 90
  max_total_tokens_per_episode: 12000      # enforced only in real mode via DELENTIA_EPISODE_MAX_TOKENS; measured prompt is ~8,000 tokens per call with 47 tools
  infrastructure_retries: 1
  logical_retries: 0
factors:
  R: rct_planning_and_runtime_verification
  F: fdia_numeric_gate_above_generic_policy_floor
  M: persistent_verified_experience_feedback
splits:
  dev: {seed: 20261008, use: build_harness_and_graders}
  validation: {seed: 20261009, use: choose_thresholds}
  test: {seed: not_chosen, use: sealed_once_after_freeze, command: "generate_tasks.py --split test --seed <n> --seal-test"}
analysis:
  cluster_unit: task_or_trajectory
  paired: true
  confidence: 0.95
  bootstrap_replicates: 10000
  multiplicity: holm
real_run_requires:
  - DELENTIA_RUN_LIVE_TESTS=1
  - "--budget-usd > 0"
  - "--model-config <file>"
  - capability_preflight_ge_70_percent_on_20_dev_tasks
