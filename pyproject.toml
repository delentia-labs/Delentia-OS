[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delentia-os"
version = "2.2.6"
description = "Delentia OS — Constitutional AI Operating System SDK"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    {name = "Ittirit Saengow", email = "ittirit720@gmail.com"},
]
maintainers = [
    {name = "Delentia Labs", email = "founder@delentia.com"},
]
requires-python = ">=3.10"
keywords = ["ai", "constitutional-ai", "intent-loop", "signedai", "fdia", "delentia", "recot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "click>=8.1.0",
    "rich>=13.7.0",
    "cryptography>=48.0.1",  # Round 29 Task 60: floor raised past real PYSEC-2026 advisories (fixed 48.0.1); only real usages are stable hazmat primitives (Ed25519/RSA/serialization), verified via full suite
    "PyJWT>=2.13.0",  # Round 20+: Layer 10 real RS256 JWT issuing (enterprise_hardening.py); floor raised Round 28 Task 53 past real CVEs PYSEC-2026-175/176/177/178/179 (fixed 2.13.0)
    "mcp>=2.0.0",  # Round 21 Phase 2: real MCP tool registry (mcp_server.py) - note: mcp 2.x renamed FastMCP to MCPServer
    # Round 19: already importable in this environment (transitive deps of
    # fastapi/uvicorn) and now directly used by several ported algorithm
    # modules (algo_09/11's real Ollama calls, algo_28's connection pool) —
    # declaring explicitly rather than relying on them staying transitive.
    "httpx>=0.27.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
graph = ["networkx>=3.0", "numpy>=1.24"]
qdrant = ["qdrant-client>=1.7"]
monitoring = ["prometheus-client>=0.20.0"]
persistence = ["aiosqlite>=0.19.0"]
llm = ["openai>=1.0.0", "anthropic>=0.20.0"]
# Round 19: algorithm-porting extras. All were already importable/installed
# in this dev environment (nothing new installed to declare these) except
# spacy/en_core_web_sm and the faiss-cpu note below — declaring them here so
# a fresh environment can reproduce the same set of real (non-simulated)
# algorithm behavior instead of silently falling back to each module's
# honest-degradation path.
vector = ["faiss-cpu>=1.8.0"]  # ALGO-16 Vector Search
ml = ["torch>=2.0.0", "scikit-learn>=1.3.0"]  # ALGO-36 RFLH (real MAML/Prototypical gradients)
web-intelligence = ["spacy>=3.7.0", "nltk>=3.10.3", "textblob>=0.18.0", "robotexclusionrulesparser>=1.7.1"]  # ALGO-34 SWCAR (run `python -m spacy download en_core_web_sm` AND `python scripts/setup_nltk_data.py` after installing — the latter works around a real nltk.download()/Python 3.13 zipfile Zip Slip incompatibility found 2026-09-16 that otherwise leaves ALGO-34's constructor retrying a network download on every kernel instantiation; nltk floor raised Round 29 Task 63 past real CVE fixes (3.10.3) — the workaround script uses zipfile.ZipFile directly, not nltk's own download/extraction code, so it's unaffected by this bump, verified via full suite). robotexclusionrulesparser added Round 35: algo_34_swcar.py imports it unconditionally at module level but it was undeclared in every manifest in this repo (requirements.txt, requirements-dev.txt, and here) - a real, latent "works on my machine only" gap found while building a real Docker image from a clean environment.
integrations = ["gql>=3.5.0", "websockets>=12.0", "loguru>=0.7.0"]  # ALGO-29 UIA
# Round 20+: heavy ML extras for the previously-deferred algorithms
# (ALGO-14/27), installed and verified real end-to-end in this session
# with the user's explicit approval. All CPU-runnable — no GPU required,
# though real inference is faster with one.
diffusion = ["diffusers>=0.30.0", "accelerate>=0.30.0", "safetensors>=0.4.0"]  # ALGO-14 RCT-Diffusion (segmind/tiny-sd)
# Round 29 Task 62: torch's own CVE fix (2.13.0) could not be installed
# in this environment - a real Windows path-length limit was hit
# ("filename or extension is too long") on a deeply-nested third-party
# license file inside the 2.13.0 wheel's dist-info, unrelated to any
# code compatibility issue. Reverted to the known-good torch==2.12.1 /
# torchvision==0.27.1 pair immediately (verified via full suite: 1416
# passed, 0 failed) rather than leave the environment broken. Fixing
# torch's CVE for real needs Windows Long Path support enabled first
# (a system setting change, the Architect's own action) - see the Round
# 29 synthesis doc's Round 30 candidate list.
media-ai = [
    "ultralytics>=8.0.0",       # ALGO-27 real object detection (YOLOv8n)
    "openai-whisper>=20231117", # ALGO-27 real speech transcription + language ID
    "pyannote.audio>=3.0.0",    # ALGO-27 real speaker diarization (its pretrained models are HuggingFace-gated; falls back to a disclosed heuristic without a real auth token)
    "soundfile>=0.12.0",        # ALGO-27 real audio metadata
    "librosa>=0.10.0",          # ALGO-27 audio processing utilities
    "imageio-ffmpeg>=0.5.0",    # ALGO-27 real ffmpeg binary (no system ffmpeg required)
]
full = [
    "networkx>=3.0", "numpy>=1.24", "qdrant-client>=1.7",
    "prometheus-client>=0.20.0", "aiosqlite>=0.19.0",
    "openai>=1.0.0", "anthropic>=0.20.0",
    "faiss-cpu>=1.8.0", "torch>=2.0.0", "scikit-learn>=1.3.0",
    "spacy>=3.7.0", "nltk>=3.10.3", "textblob>=0.18.0", "robotexclusionrulesparser>=1.7.1",
    "gql>=3.5.0", "websockets>=12.0", "loguru>=0.7.0",
    "diffusers>=0.30.0", "accelerate>=0.30.0", "safetensors>=0.4.0",
    "ultralytics>=8.0.0", "openai-whisper>=20231117", "pyannote.audio>=3.0.0",
    "soundfile>=0.12.0", "librosa>=0.10.0", "imageio-ffmpeg>=0.5.0",
]
# Round 35: `full` is a flat, independently-maintained list, NOT a
# composition of the named groups above - confirmed the hard way via a
# real `docker build` that installed `full` and still hit a real
# ModuleNotFoundError for robotexclusionrulesparser, which had only
# been added to `web-intelligence` above. Keep both lists in sync by
# hand until/unless this is refactored into a real composition.

[project.urls]
Homepage = "https://delentia.com"
Repository = "https://github.com/delentia-labs/delentia-os"
Documentation = "https://delentia.com/docs"
"Bug Tracker" = "https://github.com/delentia-labs/delentia-os/issues"

[project.scripts]
delentia = "rct_control_plane.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "signedai*", "rct_control_plane*", "microservices*"]
exclude = ["tests*", "*.tests*", "docs*", "examples*", "benchmark*", "notebooks*", "site*"]

[tool.pytest.ini_options]
testpaths = ["microservices", "core/tests", "rct_control_plane/tests", "signedai/tests", "tests", "tests/hypothesis"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --continue-on-collection-errors --import-mode=importlib"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = []

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
exclude = [
    "tests/",
    "benchmark/",
    "docs/",
    "examples/",
    "\\.venv.*",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = "rct_control_plane.cli"
ignore_errors = true

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "docs",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# Round 28 Task 56: narrow, reviewed bugbear additions - NOT the full "B"
# category (81 real findings, not individually triaged this round) or a
# broader E/B/C4/UP/SIM expansion (3178 findings, verified via a real
# dry-run - too large to safely absorb in one round). These 5 specific
# codes were each triaged and fixed (or narrowly noqa'd with a reason)
# in Round 28; see DELENTIA_ROUND28_*_SYNTHESIS.md for the Round 29 plan
# to work through the rest incrementally.
select = ["F", "B006", "B007", "B011", "B017", "B027", "B033", "B904", "B905"]
ignore = [
    "F403",  # star imports
    "F405",  # undefined or defined from star imports
]

